name: Clojure CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein test
    - name: Prod Build
      run: lein do clean, garden once, release
    - name: Inject Google tag ID
      env:
        GOOGLE_TAG_ID: ${{ vars.GOOGLE_TAG_ID }}
      run: |
        python3 - <<'PY'
        import os
        import re
        from pathlib import Path

        tag_id = os.environ.get("GOOGLE_TAG_ID", "").strip()
        if not re.fullmatch(r"[A-Za-z0-9-]+", tag_id):
            raise SystemExit("Set a valid GOOGLE_TAG_ID in GitHub Actions variables.")

        index = Path("docs/index.html")
        template = index.read_text()
        marker = "__GOOGLE_TAG_ID__"
        if marker not in template:
            raise SystemExit("Google tag marker is missing from docs/index.html.")

        index.write_text(template.replace(marker, tag_id))
        PY
    - name: Deploy to Github Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        destination_dir: codenames

