name: Clojure CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Leiningen
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        lein: 2.11.2
    - name: Install dependencies
      run: |
        lein deps
        npm ci
    - name: Run tests
      run: lein test
    - name: Prod Build
      run: lein do clean, garden once, release
    - name: Inject Google tag ID
      if: github.event_name == 'push'
      env:
        GOOGLE_TAG_ID: ${{ vars.GOOGLE_TAG_ID }}
      run: |
        python3 - <<'PY'
        import os
        import re
        from pathlib import Path

        tag_id = os.environ.get("GOOGLE_TAG_ID", "").strip()
        if tag_id and not re.fullmatch(r"[A-Za-z0-9-]+", tag_id):
            raise SystemExit("Set a valid GOOGLE_TAG_ID in GitHub Actions variables.")

        index = Path("docs/index.html")
        template = index.read_text()
        marker = "__GOOGLE_TAG_ID__"
        start = "    <!-- Google tag start -->\n"
        end = "    <!-- Google tag end -->\n"
        if template.count(marker) != 1 or template.count(start) != 1 or template.count(end) != 1:
            raise SystemExit("Google tag markers are missing or duplicated in docs/index.html.")

        before, tag_block = template.split(start)
        tag_block, after = tag_block.split(end)
        if marker not in tag_block:
            raise SystemExit("Google tag ID marker is outside the tag block.")
        index.write_text(before + (tag_block.replace(marker, tag_id) if tag_id else "") + after)
        PY
    - name: Deploy to Github Pages
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        destination_dir: codenames

